name: Verify hard-event railway
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU PyTorch for surrogate and checkpoint checks
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Python reference, task and infrastructure checks
        run: |
          cd circuits
          python -m unittest discover -s tests -v
      - name: Exact cross-language event parity
        run: |
          cd circuits
          python tests/parity_python.py
          node tests/parity_node.cjs
          python tests/ablation_parity_python.py
          node tests/ablation_parity_node.cjs
          python tests/rescue_parity_python.py
          node tests/rescue_parity_node.cjs
      - name: JavaScript syntax checks
        run: node --check circuits/circuit_core.js
